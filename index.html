<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RITVALES x Salentino Coffee Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #020102;
  --green: #82FD47;
  --white: #EFFFFE;
  --steel: #AEE1F6;
  --purple: #7D3BED;
  --purple-text: #B591F7;
  --cobalt: #224FD1;
  --cobalt-text: #6F8FF0;
  --red: #FF4B43;
  --secondary: #A7B3AE;
  --desc: #C9D3CE;
  --line: #2E3D27;
  --dim: #1A2416;
  --grotesk: 'Space Grotesk', sans-serif;
  --mono: 'Space Mono', monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--black); color: var(--white); font-family: var(--grotesk); }
body.loading * { visibility: hidden; }
body.loading { background: var(--black); }

/* ── SCANLINES ── */
.scanlines {
  position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
  background-size: 100% 3px;
  animation: scanScroll 6s linear infinite;
}
@keyframes scanScroll { to { background-position: 0 3px; } }

/* ── PARTICLE GLOW ── */
.glow {
  position: absolute; pointer-events: none;
  background-image: radial-gradient(circle, var(--glow-color) 0.9px, transparent 1.5px);
  background-size: 5px 5px;
  -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.45) 32%, transparent 64%);
  mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.45) 32%, transparent 64%);
  border-radius: 50%;
}
.glow-purple { --glow-color: #7D3BED; }
.glow-green { --glow-color: #82FD47; }
@keyframes glowBreathe {
  0%, 100% { opacity: 0.75; transform: translate(var(--gx), var(--gy)) scale(1); }
  50% { opacity: 1; transform: translate(var(--gx), var(--gy)) scale(1.04); }
}

/* ── STAGE SCALING ── */
.stage-wrapper {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: var(--black);
}
.stage {
  position: relative; overflow: hidden;
  transform-origin: center center;
  background: var(--black);
}
.stage-v { width: 384px; height: 896px; }

/* ── TERMINAL BOX ── */
.tbox {
  position: relative;
  border: 1px solid var(--tbox-color, var(--green));
  border-radius: 0;
  background: var(--black);
}
.tbox::after {
  content: '';
  position: absolute; top: -4px; right: -4px;
  width: 7px; height: 7px;
  background: var(--tbox-color, var(--green));
}

/* ── SECTION TAB ── */
.stab {
  display: inline-block;
  border: 1px solid var(--green);
  padding: 4px 12px;
  font-family: var(--mono); font-weight: 700; font-size: 14px;
  color: var(--green);
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.2;
}

/* ── CIRCUIT TRACE ── */
.circuit-trace { width: 100%; position: relative; }
.circuit-trace svg { display: block; width: 100%; }

/* ── HUD ── */
.hud { display: flex; justify-content: space-between; align-items: flex-start; }
.hud-left, .hud-right { font-family: var(--mono); font-size: 11px; color: var(--secondary); line-height: 1.4; }
.hud-time { color: var(--green); font-family: var(--mono); font-size: 11px; font-weight: 400; }
.hud-time .blink-colon { animation: blinkColon 1s steps(1) infinite; }
@keyframes blinkColon {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.open-bar {
  display: inline-block;
  border: 1px solid var(--green);
  padding: 3px 9px;
  font-family: var(--mono); font-weight: 700; font-size: 11px;
  color: var(--green); letter-spacing: 2px;
  position: relative;
}
.open-bar::after {
  content: ''; position: absolute; top: -4px; right: -4px;
  width: 7px; height: 7px; background: var(--green);
}

/* ── BRAND ── */
.brand { text-align: center; }
.brand-logo { height: 50px; display: block; margin: 0 auto; }
.brand-title { font-family: var(--grotesk); font-size: 28px; font-weight: 700; color: var(--white); display: inline; }
.brand-title .uscore { color: var(--green); }
.brand-descriptor { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--secondary); margin-left: 6px; }
.brand-slogan { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--secondary); margin-top: 2px; }

/* ── SECTION HEADER ── */
.sec-header { display: flex; align-items: center; gap: 8px; }
.sec-line { flex: 1; height: 1px; background: var(--line); }
.sec-method { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--white); white-space: nowrap; }

/* ── DRINK CARD ── */
.card {
  position: relative;
  border: 1px solid var(--card-color, var(--green));
  background: var(--black);
  display: flex; gap: 14px;
  padding: 14px;
}
.card::after {
  content: ''; position: absolute; top: -4px; right: -4px;
  width: 7px; height: 7px;
  background: var(--card-color, var(--green));
}
.card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card-name {
  font-family: var(--grotesk); font-size: 22px; font-weight: 700;
  letter-spacing: -0.5px; color: var(--card-color, var(--green));
  line-height: 1.1;
}
.card-name .uscore {
  display: inline-block;
  animation: cursorBlink 1.1s steps(1) infinite;
}
.card-type { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--white); line-height: 1.3; }
.card-origin { font-family: var(--mono); font-size: 11px; color: var(--secondary); line-height: 1.3; }
.card-desc { font-family: var(--grotesk); font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--desc); }
.card-badge {
  display: inline-block;
  background: var(--red); color: var(--black);
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  padding: 3px 9px; margin-top: 3px;
  width: fit-content;
}

/* ── FLAVOR PROFILE (VU METER) ── */
.profile {
  width: 124px; min-width: 124px; flex-shrink: 0;
  border-left: 1px dashed var(--line);
  padding-left: 12px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.prow { display: flex; flex-direction: column; gap: 3px; }
.prow-label { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
.prow-blocks { display: flex; gap: 2px; }
.pblock { width: 100%; height: 9px; background: var(--dim); flex: 1; }
.pblock.on { background: var(--card-color, var(--green)); }
.pblock.last-on { animation: vuTick 1.6s ease-in-out infinite; }
@keyframes vuTick {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* ── CURSOR BLINK ── */
@keyframes cursorBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* ── FOOTER ── */
.footer { display: flex; justify-content: space-between; align-items: center; }
.footer-left { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--green); }
.footer-right { font-family: var(--mono); font-size: 11px; color: var(--secondary); }

/* ── GLITCH ── */
.glitch-active { position: relative; }
.glitch-active::before, .glitch-active::after {
  content: attr(data-text);
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  font: inherit; letter-spacing: inherit; color: inherit;
}
.glitch-active::before { color: var(--red); transform: translate(-2px, 0); clip-path: inset(0 0 70% 0); }
.glitch-active::after { color: var(--cobalt); transform: translate(2px, 0); clip-path: inset(30% 0 50% 0); }
.glitch-slice {
  position: absolute; left: 6px; right: 0;
  height: 3px; background: var(--black);
  pointer-events: none;
}

/* ── MOBILE ── */
.mobile-stage {
  width: 100%; max-width: 480px; margin: 0 auto;
  padding: 16px 16px 32px;
  min-height: 100vh;
  position: relative; overflow: visible;
}
.mobile-stage .card-name { font-size: 22px; }
.mobile-stage .card-desc { font-size: 14px; }
.mobile-stage .profile { width: 104px; min-width: 104px; }
.mobile-stage .glow { display: none; }
.lang-toggle { display: flex; gap: 0; }
.lang-btn {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  padding: 0 10px; height: 44px; line-height: 44px;
  background: transparent; border: 1px solid var(--line); color: var(--secondary);
  cursor: pointer; letter-spacing: 1px;
}
.lang-btn.active { color: var(--green); border-color: var(--green); }

/* ── BURN-IN PROTECTION ── */
.stage { transition: transform 2s ease; }

/* ── HIDE CURSOR ── */
body.cursor-hidden, body.cursor-hidden * { cursor: none !important; }

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  .scanlines { animation: none !important; }
  .glow { animation: none !important; opacity: 0.85 !important; }
  .circuit-pulse { animation: none !important; display: none !important; }
  .pblock.last-on { animation: none !important; }
  .card-name .uscore { animation: none !important; opacity: 1 !important; }
  .brand-title .uscore { animation: none !important; opacity: 1 !important; }
  .hud-time .blink-colon { animation: none !important; opacity: 1 !important; }
  .glitch-active::before, .glitch-active::after { display: none !important; }
  .glitch-slice { display: none !important; }
  .stage { transition: none !important; }
  .decode-fade { transition: opacity 0.2s ease !important; }
}

</style>
</head>
<body class="loading">
<div class="scanlines"></div>
<div class="stage-wrapper" id="stageWrapper"></div>

<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
const I18N = {
  en: {
    descriptor: '// NOMAD COFFEE',
    hotSection: '_HOT COFFEE',
    coldSection: '_ICED COFFEE',
    festivalBadge: '_FESTIVAL DRINK',
  },
  es: {
    descriptor: '// CAFE NOMADA',
    hotSection: '_CAFE CALIENTE',
    coldSection: '_CAFE FRIO',
    festivalBadge: '_TRAGO DEL FESTIVAL',
  }
};

const DRINKS = [
  {
    id: 'tabi', name: 'TABI', color: '#AEE1F6', borderColor: '#AEE1F6',
    section: 'hot', origin: 'Quind\u00EDo, Colombia',
    type: null,
    desc: {
      en: 'Washed Tabi from Quind\u00EDo. Strawberry, rose water, caramel.',
      es: 'Tabi lavado del Quind\u00EDo. Fresa, agua de rosas, caramelo.'
    },
    profile: [
      { en: 'SWEET', es: 'DULZURA', value: 80 },
      { en: 'ACIDITY', es: 'ACIDEZ', value: 35 },
      { en: 'BODY', es: 'CUERPO', value: 60 }
    ]
  },
  {
    id: 'signal', name: 'SIGNAL', color: '#82FD47', borderColor: '#82FD47',
    section: 'cold', origin: null,
    type: { en: 'PURE COLD BREW \u00B7 STRAIGHT UP', es: 'COLD BREW PURO \u00B7 SIN MEZCLA' },
    desc: {
      en: '24h cold extraction. No milk, no sugar, no ice. Bold and clean.',
      es: 'Extracci\u00F3n en fr\u00EDo 24h. Sin leche, sin az\u00FAcar, sin hielo. Intenso y limpio.'
    },
    profile: [
      { en: 'BOLD', es: 'INTENSO', value: 90 },
      { en: 'SWEET', es: 'DULZURA', value: 40 },
      { en: 'BODY', es: 'CUERPO', value: 85 }
    ]
  },
  {
    id: 'analog', name: 'ANALOG', color: '#EFFFFE', borderColor: '#EFFFFE',
    section: 'cold', origin: null,
    type: { en: 'COLD BREW + MILK', es: 'COLD BREW + LECHE' },
    desc: {
      en: '24h cold brew with milk. Choose whole, oat, or almond. Add syrup if you want it sweet.',
      es: 'Cold brew 24h con leche. Elige entera, avena o almendras. Agr\u00E9gale syrup si lo quieres dulce.'
    },
    profile: [
      { en: 'SMOOTH', es: 'SUAVE', value: 85 },
      { en: 'SWEET', es: 'DULZURA', value: 65 },
      { en: 'BODY', es: 'CUERPO', value: 70 }
    ]
  },
  {
    id: 'frequency', name: 'FREQUENCY', color: '#224FD1', borderColor: '#6F8FF0',
    section: 'cold', origin: null,
    type: { en: 'COLD BREW + TONIC WATER', es: 'COLD BREW + AGUA TONICA' },
    badge: true,
    desc: {
      en: '24h cold brew with tonic water and ice. Bitter, fizzy, caffeinated.',
      es: 'Cold brew 24h con agua t\u00F3nica y hielo. Amargo, con gas, cafeinado.'
    },
    profile: [
      { en: 'FRESH', es: 'FRESCO', value: 90 },
      { en: 'ACIDITY', es: 'ACIDEZ', value: 70 },
      { en: 'FIZZ', es: 'BURBUJAS', value: 95 }
    ]
  }
];

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const params = new URLSearchParams(location.search);
const forceLang = params.get('lang');
const isMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth < 600;
let currentLang = forceLang === 'es' ? 'es' : forceLang === 'en' ? 'en' : 'es';
let langCycleTimer = null;
let viewMode = isMobile ? 'mobile' : 'v';
let isHidden = false;
let burnInOffset = false;
let cursorTimer = null;
let glitchTimer = null;

// ══════════════════════════════════════════
// SALENTINO LOGO SVG
// ══════════════════════════════════════════
const LOGO_SVG = '<svg viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg" style="height:50px;display:block;margin:0 auto"><text x="60" y="32" text-anchor="middle" font-family="\'Space Grotesk\',sans-serif" font-weight="700" font-size="14" fill="#EFFFFE" letter-spacing="4">SALENTINO</text><text x="60" y="46" text-anchor="middle" font-family="\'Space Mono\',monospace" font-size="7" fill="#A7B3AE" letter-spacing="2">COFFEE LAB</text></svg>';

// ══════════════════════════════════════════
// CIRCUIT TRACE SVG
// ══════════════════════════════════════════
function circuitSVG(w) {
  const id = 'cp' + Math.random().toString(36).slice(2, 8);
  return '<div class="circuit-trace"><svg viewBox="0 0 ' + w + ' 20" xmlns="http://www.w3.org/2000/svg">'
    + '<path id="' + id + '" d="M0,10 L' + (w * 0.25) + ',10 L' + (w * 0.3) + ',4 L' + (w * 0.7) + ',4 L' + (w * 0.75) + ',10 L' + w + ',10" fill="none" stroke="#82FD47" stroke-width="1.5"/>'
    + '<rect x="' + (w * 0.25 - 4) + '" y="6" width="8" height="8" fill="#020102" stroke="#82FD47" stroke-width="1.5"/>'
    + '<rect x="' + (w * 0.75 - 4) + '" y="6" width="8" height="8" fill="#020102" stroke="#82FD47" stroke-width="1.5"/>'
    + '<circle cx="' + (w * 0.5) + '" cy="4" r="2.5" fill="#82FD47"/>'
    + '<circle class="circuit-pulse" r="4" fill="#82FD47">'
    + '<animateMotion dur="2.4s" begin="0s;cpAnim.end+4.6s" id="cpAnim" fill="freeze"><mpath href="#' + id + '"/></animateMotion>'
    + '<animate attributeName="opacity" values="1;0" dur="0.3s" begin="cpAnim.end" fill="freeze"/>'
    + '<animate attributeName="opacity" values="0;1" dur="0.01s" begin="cpAnim.end+4.6s" fill="freeze"/>'
    + '</circle>'
    + '</svg></div>';
}

// ══════════════════════════════════════════
// BUILD CARD HTML
// ══════════════════════════════════════════
function cardHTML(drink, lang) {
  const nameSpan = drink.name.replace(/_$/, '') + '<span class="uscore" style="animation-delay:' + (Math.random() * 1.1).toFixed(2) + 's">_</span>';
  let h = '<div class="card" data-drink="' + drink.id + '" style="--card-color:' + drink.borderColor + '">';
  h += '<div class="card-content">';
  h += '<div class="card-name" data-text="' + drink.name + '_">' + nameSpan + '</div>';
  if (drink.type) {
    h += '<div class="card-type" data-i18n="type" data-drink-id="' + drink.id + '">' + drink.type[lang] + '</div>';
  }
  if (drink.origin) {
    h += '<div class="card-origin">\u25E2 ' + drink.origin + '</div>';
  }
  h += '<div class="card-desc" data-i18n="desc" data-drink-id="' + drink.id + '">' + drink.desc[lang] + '</div>';
  if (drink.badge) {
    h += '<div class="card-badge" data-i18n="festivalBadge">' + I18N[lang].festivalBadge + '</div>';
  }
  h += '</div>';

  // Profile
  h += '<div class="profile">';
  drink.profile.forEach(function(p, pi) {
    const filled = Math.round(p.value / 10);
    h += '<div class="prow"><div class="prow-label" data-i18n="profile" data-drink-id="' + drink.id + '" data-pi="' + pi + '">' + p[lang] + '</div>';
    h += '<div class="prow-blocks">';
    for (var b = 0; b < 10; b++) {
      var cls = 'pblock';
      if (b < filled) cls += ' on';
      if (b === filled - 1) cls += ' last-on';
      h += '<div class="' + cls + '" style="' + (b < filled ? 'background:' + drink.color : '') + '"></div>';
    }
    h += '</div></div>';
  });
  h += '</div></div>';
  return h;
}

// ══════════════════════════════════════════
// BUILD VERTICAL LAYOUT (384x896)
// ══════════════════════════════════════════
function buildVertical(lang) {
  const hot = DRINKS.filter(function(d) { return d.section === 'hot'; });
  const cold = DRINKS.filter(function(d) { return d.section === 'cold'; });

  var h = '';
  // Glows
  h += '<div class="glow glow-purple" style="width:400px;height:400px;left:-160px;top:-160px;--gx:0px;--gy:0px;animation:glowBreathe 10s ease-in-out infinite"></div>';
  h += '<div class="glow glow-green" style="width:360px;height:360px;left:200px;top:600px;--gx:0px;--gy:0px;animation:glowBreathe 10s ease-in-out infinite 5s"></div>';

  // Content wrapper
  h += '<div style="position:relative;z-index:2;display:flex;flex-direction:column;padding:16px 18px 14px;height:100%;gap:8px">';

  // HUD
  h += '<div class="hud">';
  h += '<div class="hud-left">6.2442\u00B0 N \u00B7 75.5812\u00B0 W<br>MDE / COL<br><span class="hud-time" id="hudTime"></span></div>';
  h += '<div class="hud-right"><span class="open-bar">OPEN BAR</span></div>';
  h += '</div>';

  // Brand
  h += '<div class="brand" style="margin-top:8px">';
  h += LOGO_SVG;
  h += '<div style="margin-top:4px"><span class="brand-title">B2B<span class="uscore">_</span></span>';
  h += '<span class="brand-descriptor" data-i18n="descriptor">' + I18N[lang].descriptor + '</span></div>';
  h += '<div class="brand-slogan">LENTO DE ORIGEN - RAPIDO DE TOMAR</div>';
  h += '</div>';

  // Circuit
  h += circuitSVG(348);

  // Hot section
  h += '<div>';
  h += '<div class="sec-header"><span class="stab" data-i18n="hotSection">' + I18N[lang].hotSection + '</span><div class="sec-line"></div><span class="sec-method">POUR OVER \u00B7 V60</span></div>';
  h += '<div class="hot-cards" style="display:flex;flex-direction:column;gap:7px;margin-top:7px">';
  hot.forEach(function(d) { h += cardHTML(d, lang); });
  h += '</div></div>';

  // Cold section
  h += '<div>';
  h += '<div class="sec-header"><span class="stab" data-i18n="coldSection">' + I18N[lang].coldSection + '</span><div class="sec-line"></div><span class="sec-method">COLD BREW \u00B7 24H</span></div>';
  h += '<div class="cold-cards" style="display:flex;flex-direction:column;gap:7px;margin-top:7px">';
  cold.forEach(function(d) { h += cardHTML(d, lang); });
  h += '</div></div>';

  // Footer
  h += '<div class="footer" style="margin-top:auto">';
  h += '<div class="footer-left">_FUEL THE RITUAL</div>';
  h += '<div class="footer-right">salentino.co \u00B7 @salentino.co</div>';
  h += '</div>';

  h += '</div>'; // content wrapper
  return h;
}



// ══════════════════════════════════════════
// BUILD MOBILE LAYOUT
// ══════════════════════════════════════════
function buildMobile(lang) {
  const hot = DRINKS.filter(function(d) { return d.section === 'hot'; });
  const cold = DRINKS.filter(function(d) { return d.section === 'cold'; });

  var h = '<div class="mobile-stage">';

  // HUD with lang toggle
  h += '<div class="hud" style="margin-bottom:12px">';
  h += '<div class="hud-left">6.2442\u00B0 N \u00B7 75.5812\u00B0 W<br>MDE / COL</div>';
  h += '<div style="display:flex;align-items:flex-start;gap:8px">';
  h += '<div class="lang-toggle"><button class="lang-btn' + (lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button><button class="lang-btn' + (lang === 'es' ? ' active' : '') + '" data-lang="es">ES</button></div>';
  h += '<span class="open-bar">OPEN BAR</span>';
  h += '</div></div>';

  // Brand
  h += '<div class="brand" style="margin-bottom:12px">';
  h += LOGO_SVG;
  h += '<div style="margin-top:4px"><span class="brand-title">B2B<span class="uscore">_</span></span>';
  h += '<span class="brand-descriptor" data-i18n="descriptor">' + I18N[lang].descriptor + '</span></div>';
  h += '<div class="brand-slogan">LENTO DE ORIGEN - RAPIDO DE TOMAR</div>';
  h += '</div>';

  // Circuit
  h += circuitSVG(448);

  // Hot section
  h += '<div style="margin-top:12px">';
  h += '<div class="sec-header"><span class="stab" data-i18n="hotSection">' + I18N[lang].hotSection + '</span><div class="sec-line"></div><span class="sec-method">POUR OVER \u00B7 V60</span></div>';
  h += '<div class="hot-cards" style="display:flex;flex-direction:column;gap:10px;margin-top:8px">';
  hot.forEach(function(d) { h += cardHTML(d, lang); });
  h += '</div></div>';

  // Cold section
  h += '<div style="margin-top:16px">';
  h += '<div class="sec-header"><span class="stab" data-i18n="coldSection">' + I18N[lang].coldSection + '</span><div class="sec-line"></div><span class="sec-method">COLD BREW \u00B7 24H</span></div>';
  h += '<div class="cold-cards" style="display:flex;flex-direction:column;gap:10px;margin-top:8px">';
  cold.forEach(function(d) { h += cardHTML(d, lang); });
  h += '</div></div>';

  // Footer
  h += '<div class="footer" style="margin-top:20px;padding-top:12px;border-top:1px solid #2E3D27">';
  h += '<div class="footer-left">_FUEL THE RITUAL</div>';
  h += '<div class="footer-right">salentino.co \u00B7 @salentino.co</div>';
  h += '</div>';

  h += '</div>';
  return h;
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render() {
  var wrapper = document.getElementById('stageWrapper');

  if (viewMode === 'mobile') {
    wrapper.style.overflow = 'auto';
    wrapper.style.display = 'block';
    wrapper.innerHTML = buildMobile(currentLang);
    wrapper.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        setLang(btn.dataset.lang);
      });
    });
  } else {
    wrapper.style.overflow = 'hidden';
    wrapper.style.display = 'flex';
    wrapper.innerHTML = '<div class="stage stage-v" id="stage">' + buildVertical(currentLang) + '</div>';
    scaleStage();
  }

  updateClock();
  animateVUEntry();
}

// ══════════════════════════════════════════
// SCALE STAGE
// ══════════════════════════════════════════
function scaleStage() {
  var stage = document.getElementById('stage');
  if (!stage) return;
  var scale = Math.min(window.innerWidth / 384, window.innerHeight / 896);
  stage.style.transform = 'scale(' + scale + ')';
}

// ══════════════════════════════════════════
// CLOCK
// ══════════════════════════════════════════
function updateClock() {
  var el = document.getElementById('hudTime');
  if (!el) return;
  var now = new Date();
  var hh = String(now.getHours()).padStart(2, '0');
  var mm = String(now.getMinutes()).padStart(2, '0');
  el.innerHTML = hh + '<span class="blink-colon">:</span>' + mm;
}
setInterval(updateClock, 1000);

// ══════════════════════════════════════════
// VU METER ENTRY ANIMATION
// ══════════════════════════════════════════
function animateVUEntry() {
  document.querySelectorAll('.prow-blocks').forEach(function(row) {
    var blocks = row.querySelectorAll('.pblock.on');
    blocks.forEach(function(b, i) {
      b.style.opacity = '0';
      setTimeout(function() { b.style.opacity = '1'; }, i * 30);
    });
  });
}

// ══════════════════════════════════════════
// LANGUAGE SYSTEM
// ══════════════════════════════════════════
function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  document.documentElement.lang = lang;

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reducedMotion || viewMode === 'mobile') {
    updateTexts(lang);
    updateMobileLangBtns(lang);
    animateVUEntry();
    return;
  }

  try {
    decodeTransition(lang);
  } catch(e) {
    // Fallback: direct text swap
    updateTexts(lang);
    animateVUEntry();
  }
}

function updateTexts(lang) {
  // I18N keys
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.dataset.i18n;
    if (key === 'descriptor' || key === 'hotSection' || key === 'coldSection' || key === 'festivalBadge') {
      el.textContent = I18N[lang][key];
    }
    if (key === 'type') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      if (drink && drink.type) el.textContent = drink.type[lang];
    }
    if (key === 'desc') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      if (drink) el.textContent = drink.desc[lang];
    }
    if (key === 'profile') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      if (drink) el.textContent = drink.profile[parseInt(el.dataset.pi)][lang];
    }
  });
}

function updateMobileLangBtns(lang) {
  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

// ══════════════════════════════════════════
// DECODE TRANSITION
// ══════════════════════════════════════════
var SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_/#%';
function decodeTransition(newLang) {
  var els = document.querySelectorAll('[data-i18n]');
  var sortedEls = Array.from(els);

  // Fix widths to prevent layout jump
  sortedEls.forEach(function(el) {
    el.style.width = el.offsetWidth + 'px';
    el.style.display = 'inline-block';
  });

  sortedEls.forEach(function(el, idx) {
    var key = el.dataset.i18n;
    var target = '';
    if (key === 'descriptor' || key === 'hotSection' || key === 'coldSection' || key === 'festivalBadge') {
      target = I18N[newLang][key];
    } else if (key === 'type') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      target = drink && drink.type ? drink.type[newLang] : el.textContent;
    } else if (key === 'desc') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      target = drink ? drink.desc[newLang] : el.textContent;
    } else if (key === 'profile') {
      var drink = DRINKS.find(function(d) { return d.id === el.dataset.drinkId; });
      target = drink ? drink.profile[parseInt(el.dataset.pi)][newLang] : el.textContent;
    }

    var delay = idx * 15;
    setTimeout(function() { scrambleText(el, target); }, delay);
  });

  // Re-animate VU meters
  setTimeout(animateVUEntry, 200);

  // Release fixed widths after transition
  setTimeout(function() {
    sortedEls.forEach(function(el) {
      el.style.width = '';
      el.style.display = '';
    });
  }, 800);
}

function scrambleText(el, target) {
  var len = Math.max(el.textContent.length, target.length);
  var duration = 500;
  var start = performance.now();

  function step(now) {
    var progress = Math.min((now - start) / duration, 1);
    var revealed = Math.floor(progress * len);
    var result = '';
    for (var i = 0; i < len; i++) {
      if (i < revealed) {
        result += target[i] || '';
      } else if (i < target.length) {
        result += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
      }
    }
    el.textContent = result;
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

// ══════════════════════════════════════════
// LANGUAGE CYCLE (screens only)
// ══════════════════════════════════════════
var langPhase = 'es';
function startLangCycle() {
  if (forceLang || viewMode === 'mobile') return;
  clearTimeout(langCycleTimer);

  function cycle() {
    var delay = langPhase === 'en' ? 20000 : 10000;
    langCycleTimer = setTimeout(function() {
      if (isHidden) return;
      var next = langPhase === 'en' ? 'es' : 'en';
      setLang(next);
      langPhase = next;
      cycle();
    }, delay);
  }
  cycle();
}

// ══════════════════════════════════════════
// GLITCH EFFECT
// ══════════════════════════════════════════
function scheduleGlitch() {
  var delay = (45 + Math.random() * 30) * 1000;
  glitchTimer = setTimeout(function() {
    if (isHidden) { scheduleGlitch(); return; }
    doGlitch();
    scheduleGlitch();
  }, delay);
}

function doGlitch() {
  var names = document.querySelectorAll('.card-name');
  if (!names.length) return;
  var target = names[Math.floor(Math.random() * names.length)];
  var text = target.dataset.text || target.textContent;
  target.classList.add('glitch-active');
  target.setAttribute('data-text', text);

  // Add slice
  var slice = document.createElement('div');
  slice.className = 'glitch-slice';
  slice.style.top = Math.floor(Math.random() * 80) + '%';
  target.appendChild(slice);

  setTimeout(function() {
    target.classList.remove('glitch-active');
    if (slice.parentNode) slice.parentNode.removeChild(slice);
  }, 250);
}

// ══════════════════════════════════════════
// BURN-IN PROTECTION
// ══════════════════════════════════════════
function startBurnInProtection() {
  setInterval(function() {
    var stage = document.getElementById('stage');
    if (!stage || isHidden) return;
    if (burnInOffset) {
      scaleStage(); // resets to center
      burnInOffset = false;
    } else {
      var dx = Math.round((Math.random() - 0.5) * 4); // -2 to 2
      var dy = Math.round((Math.random() - 0.5) * 4);
      var scale = Math.min(window.innerWidth / 384, window.innerHeight / 896);
      stage.style.transform = 'scale(' + scale + ') translate(' + dx + 'px,' + dy + 'px)';
      burnInOffset = true;
    }
  }, 300000); // 5 min
}

// ══════════════════════════════════════════
// CURSOR HIDE
// ══════════════════════════════════════════
function setupCursorHide() {
  function hide() { document.body.classList.add('cursor-hidden'); }
  function show() {
    document.body.classList.remove('cursor-hidden');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(hide, 3000);
  }
  document.addEventListener('mousemove', show);
  cursorTimer = setTimeout(hide, 3000);
}

// ══════════════════════════════════════════
// VISIBILITY
// ══════════════════════════════════════════
document.addEventListener('visibilitychange', function() {
  isHidden = document.hidden;
  if (!isHidden) {
    updateClock();
    if (!forceLang && viewMode !== 'mobile') {
      startLangCycle();
    }
  } else {
    clearTimeout(langCycleTimer);
    langCycleTimer = null;
  }
});

// ══════════════════════════════════════════
// WAKE LOCK
// ══════════════════════════════════════════
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      var lock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async function() {
        if (!document.hidden && 'wakeLock' in navigator) {
          lock = await navigator.wakeLock.request('screen');
        }
      });
    }
  } catch(e) { /* Wake Lock not supported or denied */ }
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function init() {
  if (isMobile && !forceLang) {
    currentLang = (navigator.language || '').startsWith('es') ? 'es' : 'en';
  }

  document.documentElement.lang = currentLang;
  render();

  window.addEventListener('resize', function() {
    if (viewMode !== 'mobile') scaleStage();
  });

  startLangCycle();
  scheduleGlitch();
  startBurnInProtection();
  setupCursorHide();
  requestWakeLock();

  // Reveal
  document.body.classList.remove('loading');
  document.getElementById('stageWrapper').style.opacity = '0';
  requestAnimationFrame(function() {
    document.getElementById('stageWrapper').style.transition = 'opacity 0.4s ease';
    document.getElementById('stageWrapper').style.opacity = '1';
  });
}

// Wait for fonts
document.fonts.ready.then(init);
</script>
